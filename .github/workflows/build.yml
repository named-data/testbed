name: Build
on:
  push:
    branches:
      - '**'
    paths:
      - 'framework/**'
  pull_request:
    paths:
      - 'framework/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Enable deployment'
        type: boolean

permissions:
  contents: write

jobs:
  status-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build status page
        working-directory: framework/ndn-testbed-status
        run: |
          npm ci
          npm run build
      - name: Deploy
        if: (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./framework/ndn-testbed-status/dist
          force_orphan: true
